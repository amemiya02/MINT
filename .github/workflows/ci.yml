# Checks and tests on every pull request (and on pushes to the main branches),
# on macOS, Windows and Linux. No performance gates.
name: CI

on:
  pull_request:
  push:
    branches: [main, "feat/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Platform-independent checks: run once.
  lint:
    name: Lint and type check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: pnpm install --frozen-lockfile
      - name: Biome
        run: pnpm exec biome ci .
      - name: Type check
        run: pnpm typecheck
      - name: Package manager manifests (Homebrew cask, winget)
        run: pnpm test:packaging
      - name: rustfmt
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test

      # Use the same frontend for Playwright and tauri::generate_context! below.
      - name: Build frontend
        run: pnpm --filter @mint/desktop build:web
      - name: Install Playwright browser
        run: pnpm --filter @mint/desktop exec playwright install --with-deps chromium
      - name: E2E tests
        run: pnpm test:e2e
        env:
          MINT_E2E_PREVIEW: "1"
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.os }}
          path: |
            apps/desktop/playwright-report/
            apps/desktop/test-results/
          if-no-files-found: ignore

      - name: Clippy
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Rust tests
        run: pnpm test:rust

  windows-pdf:
    name: Native PDF export (Windows, WebView2)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - name: Build frontend
        run: pnpm --filter @mint/desktop build:web
      - name: Add preview observer to the acceptance build
        working-directory: apps/desktop
        shell: pwsh
        run: |
          Copy-Item smoke/windows-pdf-probe.js dist/windows-pdf-probe.js
          $dir = [Net.WebUtility]::HtmlEncode("$env:RUNNER_TEMP/mint-webview2-proof")
          $probe = "<script defer src='/windows-pdf-probe.js' data-proof='$dir'></script>"
          foreach ($page in 'dist/index.html', 'dist/print.html') {
            $html = Get-Content $page -Raw
            $html.Replace('</body>', "$probe</body>") | Set-Content $page -NoNewline
          }
      - name: Build MINT for WebView2 PDF verification
        working-directory: apps/desktop/src-tauri
        run: cargo build --locked --features tauri/custom-protocol --bin mint
      - name: Ensure Evergreen WebView2 Runtime is installed
        shell: pwsh
        run: |
          $runtime = '{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $keys = @("HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\$runtime", "HKCU:\Software\Microsoft\EdgeUpdate\Clients\$runtime")
          function Get-RuntimeVersion {
            Get-ItemPropertyValue -Path $keys -Name pv -ErrorAction SilentlyContinue | Where-Object { [version]$_ -gt [version]'0.0.0.0' }
          }
          if (!(Get-RuntimeVersion)) {
            $setup = Join-Path $env:RUNNER_TEMP MicrosoftEdgeWebview2Setup.exe
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $setup
            $install = Start-Process $setup -ArgumentList '/silent', '/install' -Wait -PassThru
            if (!(Get-RuntimeVersion)) { throw "WebView2 Runtime installation failed (exit $($install.ExitCode))" }
          }
          Write-Host "WebView2 Runtime $(Get-RuntimeVersion)"
      - name: Verify native WebView2 PDF output
        working-directory: apps/desktop
        timeout-minutes: 5
        env:
          MINT_PDF_PROOF: ${{ runner.temp }}/mint-webview2-proof
        run: node --test smoke/windows-pdf.smoke.ts
      - name: Upload WebView2 PDF and preview
        if: "!cancelled()"
        uses: actions/upload-artifact@v4
        with:
          name: windows-webview2-pdf
          path: |
            ${{ runner.temp }}/mint-webview2-proof/field.pdf
            ${{ runner.temp }}/mint-webview2-proof/preview.json
          if-no-files-found: ignore

  # The real app (Tauri, WebKitGTK, Rust backend) driven over WebDriver by tauri-driver:
  # open a document from the command line, edit it, save it. Linux only, since
  # tauri-driver has no macOS support and WebKitWebDriver is the Linux driver.
  smoke:
    name: Desktop smoke test (Linux, tauri-driver)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - name: Install Tauri system dependencies, WebKitWebDriver and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf webkit2gtk-driver xvfb xauth xdotool python3-pyatspi at-spi2-core dbus-x11 gnome-keyring libsecret-tools bubblewrap
      - name: Install tauri-driver
        run: cargo install tauri-driver --locked
      - run: pnpm install --frozen-lockfile
      - name: Build the app (debug, no installers)
        run: pnpm --filter @mint/desktop tauri build --debug --no-bundle
      - name: Install Codex CLI for the task copy sandbox smoke test
        run: |
          npm install --prefix "$RUNNER_TEMP/mint-smoke-codex" --no-audit --no-fund @openai/codex@0.169.1
          echo "MINT_SMOKE_CODEX=$RUNNER_TEMP/mint-smoke-codex/node_modules/.bin/codex" >> "$GITHUB_ENV"
      - name: Smoke test
        working-directory: apps/desktop
        env:
          MINT_APP: ${{ github.workspace }}/apps/desktop/src-tauri/target/debug/mint
        run: |
          fixture=$(mktemp -d)
          trap 'rm -rf "$fixture"' EXIT
          # The app, driver, keyring and D-Bus-activated services share this fixture.
          export HOME="$fixture/home" LC_ALL=C.UTF-8 NO_AT_BRIDGE=0
          export XDG_DATA_HOME="$fixture/data" XDG_CONFIG_HOME="$fixture/config"
          export XDG_RUNTIME_DIR="$fixture/runtime" XDG_CACHE_HOME="$fixture/cache"
          unset GNOME_KEYRING_CONTROL GNOME_KEYRING_PID AT_SPI_BUS_ADDRESS
          mkdir -m 700 "$HOME" "$XDG_RUNTIME_DIR"
          export MINT_SMOKE_CREDENTIAL_POLICY="$fixture/credentials.conf"
          echo '<busconfig/>' > "$MINT_SMOKE_CREDENTIAL_POLICY"
          cat > "$fixture/session.conf" <<EOF
          <busconfig>
            <include>/usr/share/dbus-1/session.conf</include>
            <include>$MINT_SMOKE_CREDENTIAL_POLICY</include>
          </busconfig>
          EOF
          xvfb-run -a -s '-screen 0 1280x1024x24' \
            dbus-run-session --config-file="$fixture/session.conf" -- bash -euo pipefail -c '
            printf %s mint-smoke-fixture | timeout 15s gnome-keyring-daemon --unlock --components=secrets
            printf %s ready | timeout 15s secret-tool store --label="Smoke setup" mint-smoke setup
            test "$(timeout 15s secret-tool lookup mint-smoke setup)" = ready
            timeout 15s secret-tool clear mint-smoke setup
            gdbus call --session --dest org.a11y.Bus --object-path /org/a11y/bus --method org.a11y.Bus.GetAddress
            gdbus call --session --dest org.a11y.Bus --object-path /org/a11y/bus --method org.freedesktop.DBus.Properties.Set org.a11y.Status IsEnabled "<true>"
            tauri-driver &
            driver_pid=$!
            cleanup() {
              kill "$driver_pid" 2>/dev/null || true
              wait "$driver_pid" 2>/dev/null || true
            }
            trap cleanup EXIT
            node --test --test-reporter=tap smoke/open-edit-save.smoke.ts
          '

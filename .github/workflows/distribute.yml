# Renders the Homebrew cask and winget manifests with the checksums of the
# released installers and uploads them as the package-manifests artifact.
#
# Runs at the end of release.yml (a release published by GITHUB_TOKEN does not
# trigger other workflows), when a release is published by hand, or manually
# for an existing tag (Actions › Distribute › Run workflow).
name: Distribute

on:
  release:
    types: [released]
  workflow_call:
    inputs:
      tag:
        description: Release tag, e.g. v0.2.0
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. v0.2.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: distribute-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  manifests:
    name: Render package manifests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Resolve the release
        id: release
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected a release tag vX.Y.Z, got '${TAG}'."
            exit 1
          fi
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${TAG#v}" >> "${GITHUB_OUTPUT}"
      - name: Download the installers
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          mkdir -p assets
          for name in $(node packaging/render.mjs assets "${VERSION}"); do
            case "${name}" in
              *.dmg|*-setup.exe) gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" --dir assets --pattern "${name}" ;;
            esac
          done
      - name: Render the cask and winget manifests
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          node packaging/render.mjs manifests "${VERSION}" assets out
          find out -type f -print
      - uses: actions/upload-artifact@v4
        with:
          name: package-manifests
          path: out/

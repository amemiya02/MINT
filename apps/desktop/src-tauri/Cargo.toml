[package]
name = "mint"
version = "0.1.0"
description = "MINT Is Not Typora: an open-source, cross-platform, lightweight Markdown editor"
license = "MIT"
edition = "2021"
rust-version = "1.85"

[lib]
name = "mint_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
tempfile = "3.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify-debouncer-full = "0.7"

[lints.clippy]
all = { level = "warn", priority = -1 }

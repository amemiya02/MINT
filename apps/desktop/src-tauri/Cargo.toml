[package]
name = "mint"
version = "0.3.2"
description = "MINT Is Not Typora: an open-source, cross-platform, lightweight Markdown editor"
license = "MIT"
edition = "2021"
rust-version = "1.85"

[lib]
name = "mint_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
grep-matcher = "0.1.9"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
base64 = "0.23"
ignore = "0.4"
notify = "8.2"
notify-debouncer-full = "0.7"
serde = { version = "1.0.229", features = ["derive"] }
tauri = { version = "2.12", features = ["protocol-asset"] }
tauri-plugin-clipboard-manager = "2.3"
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
tempfile = "3.27"
serde_json = "1"
trash = "5.3"

# Auto-update (desktop only).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2.14"
tauri-plugin-process = "2.4"
tauri-plugin-single-instance = "2"

[lints.clippy]
all = { level = "warn", priority = -1 }

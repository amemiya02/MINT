[package]
name = "mint"
version = "0.1.0"
description = "MINT Is Not Typora: an open-source, cross-platform, lightweight Markdown editor"
license = "MIT"
edition = "2021"
rust-version = "1.85"

[lib]
name = "mint_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
ignore = "0.4"
notify = "8.2"
notify-debouncer-full = "0.7"
serde = { version = "1.0.229", features = ["derive"] }
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tempfile = "3.27"
serde_json = "1"
trash = "5.3"

[lints.clippy]
all = { level = "warn", priority = -1 }

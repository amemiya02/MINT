[package]
name = "mint"
version = "0.3.4"
description = "MINT Is Not Typora: an open-source, cross-platform, lightweight Markdown editor"
license = "MIT"
edition = "2021"
rust-version = "1.85"

[lib]
name = "mint_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
grep-matcher = "0.1.9"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
base64 = "0.23"
ignore = "0.4"
notify = "8.2"
notify-debouncer-full = "0.7"
serde = { version = "1.0.229", features = ["derive"] }
tauri = { version = "2.12", features = ["protocol-asset"] }
tauri-plugin-clipboard-manager = "2.3"
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
tempfile = "3.27"
serde_json = "1"
reqwest = { version = "0.13", default-features = false }
sha2 = "0.10"
trash = "5.3"

# Auto-update (desktop only).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2.14"
tauri-plugin-process = "2.4"
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSPrintInfo", "NSPrintOperation", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSGeometry", "NSObject"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["WKWebView", "objc2-app-kit"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
webkit2gtk = "2"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"

[lints.clippy]
all = { level = "warn", priority = -1 }
